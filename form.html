<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Créer un défi</title>
</head>

<div class=" h-screen flex justify-center items-center bg-gray-200 ">
    <div class="bg-white  w-fit rounded-xl p-5 shadow-2xl px-10

">
        <div class="mb-5">
            <h2 class="font-bold text-lg

">Créer un défi</h2>
            <p class="text-slate-500">Eemplissez les informations de votre défi</p>
        </div>
        <form>

            <label for="" class="font-semibold">Un titre</label><br>
            <input type="text" placeholder="Entrer un titre" class="border border-slate-300 rounded-lg  mb-2 w-full p-2"><br>


            <label for="" class="font-semibold">Un sport</label><br>
            <input type="text" placeholder="Entrer un sport" class="border border-slate-300 rounded-lg mb-2 w-full p-2  "><br>

            <label for="" class="font-semibold">Une description</label><br>
            <textarea class="border border-slate-300 rounded-lg mb-2 w-full p-2" name="" id="">Entrer une description</textarea><br>

            <label for="" class="font-semibold">L'objectif</label><br>
            <input type="text" placeholder="Entrer l'objectif" class="border border-slate-300 rounded-lg mb-2 w-full p-2"><br>
            
            <label for="" class="font-semibold">Une date limite</label><br>
            
            <input type="date" class="border border-slate-300 rounded-lg mb-2 w-full p-2"><br>
            <button class="bg-lime-400 w-full rounded-lg font-semibold p-2">Submit</button>

        </form>
    </div>
</div>

</html>
